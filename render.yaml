services:
  - type: web
    name: nichanue-api
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nichanue
      - key: NICHANUE_FEE_KES
        value: "50"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: TALKSASA_API_KEY
        sync: false
      - key: TALKSASA_VERIFY_START_URL
        sync: false
      - key: TALKSASA_VERIFY_CONFIRM_URL
        sync: false